name: Knowledge Agent Smoke

# Owner-triggered connectivity check for the Pi + LiteLLM + Cloudflare
# Access path. Prints no credentials; a success means the provider
# configuration, service token, and virtual key work end to end.

on:
  workflow_dispatch:

permissions: {}

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PI_VERSION: 0.84.4
      NODE_VERSION: "22"
      PYTHON_VERSION: "3.12"
      LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
      LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      LITELLM_MODEL_LOW: ${{ vars.LITELLM_MODEL_LOW }}
      LITELLM_MODEL_HIGH: ${{ vars.LITELLM_MODEL_HIGH }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Pi
        run: npm install -g @earendil-works/pi-coding-agent@${{ env.PI_VERSION }}
      - name: Diagnose provider stream
        env:
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          LITELLM_MODEL_LOW: ${{ vars.LITELLM_MODEL_LOW }}
        run: |
          set -euo pipefail
          base="${LITELLM_BASE_URL%/}"; case "$base" in */v1) ;; *) base="$base/v1";; esac
          url="$base/chat/completions"
          auth=(-H "Authorization: Bearer $LITELLM_API_KEY" -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" -H "Content-Type: application/json")
          body='{"model":"'"$LITELLM_MODEL_LOW"'","messages":[{"role":"user","content":"Say exactly: ok"}],"max_tokens":16}'
          body_stream='{"model":"'"$LITELLM_MODEL_LOW"'","messages":[{"role":"user","content":"Say exactly: ok"}],"max_tokens":16,"stream":true}'
          echo "== response headers (non-streaming, no follow) =="
          curl -sS -D - -o /dev/null --max-time 90 "${auth[@]}" -d "$body" "$url" | tr -d '\r' | grep -iE '^HTTP/|^(location|server|cf-mitigated|cf-access|content-type):' || true
          echo "== follow redirects =="
          curl -sS -L -o /tmp/one.json -w 'final: %{http_code} %{url_effective}\n' --max-time 90 "${auth[@]}" -d "$body" "$url" || true
          head -c 400 /tmp/one.json; echo
          echo "== non-streaming (direct) =="
          code=$(curl -sS -o /tmp/one.json -w '%{http_code}' --max-time 90 "${auth[@]}" -d "$body" "$url")
          echo "HTTP $code"; head -c 700 /tmp/one.json; echo
          echo "== streaming (first 80 SSE lines) =="
          curl -sS -N --max-time 90 "${auth[@]}" -d "$body_stream" "$url" | head -80 | cut -c1-400
      - name: Run smoke stage
        env:
          WORK_DIR: /tmp/knowledge-smoke
          REPO_ROOT: ${{ github.workspace }}
        run: |
          mkdir -p "$WORK_DIR"
          bash scripts/run-stage.sh smoke
      - name: Report
        run: |
          echo "smoke check passed: Pi reached the LiteLLM model through Cloudflare Access"
